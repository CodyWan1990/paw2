[package]
name = "paw2"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "347b2b30225b0425f0b44dc4c590e768f7dbe73e"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "xwayland",
]

[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay"
rev = "347b2b30225b0425f0b44dc4c590e768f7dbe73e"
