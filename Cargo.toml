[package]
name = "paw2"
version = "0.1.0"
edition = "2024"
license = "MIT"
# A compositor binary, not a library; this keeps `cargo publish` from ever
# being the accident that ships it.
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
# Nothing here catches a panic, and a panic in a compositor ends the session
# either way - aborting hands the DRM state back to the kernel rather than
# unwinding through it. Together with stripping this is ~4.5 MB off the binary.
panic = "abort"
strip = true

[dependencies]
# Only for installing the SIGTERM/SIGINT handlers; rustix has no stable sigaction.
libc = "0.2"
fontdue = "0.9.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "347b2b30225b0425f0b44dc4c590e768f7dbe73e"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "xwayland",
]

[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay"
rev = "347b2b30225b0425f0b44dc4c590e768f7dbe73e"
